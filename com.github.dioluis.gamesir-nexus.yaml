app-id: com.github.dioluis.gamesir-nexus
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: gamesir-nexus

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --env=QT_QPA_PLATFORM=wayland;xcb

build-options:
  env:
    PYTHONDONTWRITEBYTECODE: "1"
  build-args:
    - --share=network

modules:
  - name: xcb-util-cursor
    buildsystem: autotools
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/xcb-util-cursor-0.1.4.tar.gz
        sha256: cc8608ebb695742b6cf84712be29b2b66aa5f6768039528794fca0fa283022bf

  - name: gamesir-nexus
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app PySide6
      - install -D gamesir-nexus.py /app/bin/gamesir-nexus
      - chmod +x /app/bin/gamesir-nexus
    sources:
      - type: file
        path: gamesir-nexus.py
