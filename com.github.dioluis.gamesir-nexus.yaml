app-id: com.github.dioluis.gamesir-nexus
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: gamesir-nexus
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --device=all
  - --env=QT_QPA_PLATFORM=xcb
modules:
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip install --prefix=/app PySide6 evdev

  - name: gamesir-nexus
    buildsystem: simple
    build-commands:
      - install -D gamesir-nexus.py /app/bin/gamesir-nexus
      - chmod +x /app/bin/gamesir-nexus
      - install -D logo.jpeg /app/bin/logo.jpeg
      - install -D chave.png /app/bin/chave.png
      - install -D com.github.dioluis.gamesir-nexus.desktop /app/share/applications/com.github.dioluis.gamesir-nexus.desktop
    sources:
      - type: file
        path: gamesir-nexus.py
      - type: file
        path: logo.jpeg
      - type: file
        path: chave.png
      - type: file
        path: com.github.dioluis.gamesir-nexus.desktop
