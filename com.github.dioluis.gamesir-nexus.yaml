id: com.github.dioluis.gamesir-nexus
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: gamesir-nexus
finish-args:
  - --device=all
  - --share=ipc
  - --socket=x11
  - --socket=wayland
build-options:
  # Sintaxe oficial corrigida para liberar o barramento de rede durante o processo de build do pip
  build-args:
    - --share=network
modules:
  - name: python3-pyside6
    buildsystem: simple
    build-commands:
      # Baixa e instala o Qt de forma isolada dentro da árvore do Flatpak
      - pip3 install --target=/app/lib/python3.11/site-packages shiboken6 PySide6
  - name: gamesir-nexus
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - mkdir -p /app/bin
      - cp gamesir-nexus.py /app/bin/gamesir-nexus
      - chmod +x /app/bin/gamesir-nexus
      - cp profile_default.json /app/bin/profile_default.json
