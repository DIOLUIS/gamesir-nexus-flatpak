id: com.github.dioluis.gamesir-nexus
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: gamesir-nexus
finish-args:
  - --device=all
  - --share=ipc
  - --socket=x11
modules:
  - name: gamesir-nexus
    buildsystem: simple
    build-commands:
      # Cria a pasta de binários e copia o utilitário principal
      - mkdir -p /app/bin
      - cp gamesir-nexus.py /app/bin/gamesir-nexus
      - chmod +x /app/bin/gamesir-nexus
      # Copia o perfil padrão de fábrica para dentro do ambiente do app
      - cp profile_default.json /app/bin/profile_default.json
