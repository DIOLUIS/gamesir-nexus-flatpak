app-id: io.github.dioluis.gamesir_nexus
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: gamesir-nexus
finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --share=ipc

modules:
  - name: gamesir-nexus
    buildsystem: simple
    build-commands:
      - install -D -m 755 gamesir-nexus.py /app/bin/gamesir-nexus
      - install -D -m 644 diottec.jpeg /app/bin/diottec.jpeg
      - install -D -m 644 io.github.dioluis.gamesir_nexus.desktop /app/share/applications/io.github.dioluis.gamesir_nexus.desktop
      - install -D -m 644 io.github.dioluis.gamesir_nexus.metainfo.xml /app/share/metainfo/io.github.dioluis.gamesir_nexus.metainfo.xml
    sources:
      - type: dir
        path: .
