app-id: io.github.dioluis.gamesir_nexus
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: gamesir-nexus.py

finish-args:
  # Permissões Gráficas e de Janela
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  
  # A permissão crítica de Hardware (Liberta a app do Sudo)
  - --device=all

modules:
  - name: gamesir-nexus
    buildsystem: simple
    build-commands:
      # Instala o script principal
      - install -D gamesir-nexus.py /app/bin/gamesir-nexus.py
      - chmod +x /app/bin/gamesir-nexus.py
      # Copia a imagem do sobre (se existir)
      - cp diottec.jpeg /app/bin/diottec.jpeg || true
    sources:
      - type: dir
        path: .
